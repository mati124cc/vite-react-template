<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>JW Player — ClearKey Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin:0; background:#0f1115; color:#fff; font-family:sans-serif; }
    #player { width:100%; height:100vh; background:#000; }
  </style>
  <!-- JW Player (cloud-hosted) -->
  <script src="https://cdn.jwplayer.com/libraries/your-library-key.js"></script>
</head>
<body>
  <div id="player"></div>

  <script>
    // Twój manifest MPEG-DASH
    const MPD_URL = "https://n-25-31.dcs.redcdn.pl/livedash/o2/wpp/live/11/live.livx?indexMode&dvr=7200000";

    // ClearKey para (keyId : key)
    const CLEARKEYS = {
      "20838b6bc2df0373e95a35538e666a2e": "6f10fbc7965f120a820e6d4dc9fcfa34"
    };

    jwplayer("player").setup({
      file: MPD_URL,
      autostart: true,
      mute: true,
      width: "100%",
      height: "100%",
      type: "dash",
      drm: {
        clearkey: CLEARKEYS
      }
    });
  </script>
</body>
</html>
