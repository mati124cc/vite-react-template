<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Shaka Player — ClearKey Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin:0; background:#0f1115; color:#fff; font-family:sans-serif; }
    #video { width:100%; height:100vh; background:#000; }
  </style>
  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.9.2/shaka-player.compiled.min.js"></script>
</head>
<body>
  <video id="video" controls autoplay muted></video>

  <script>
    // Twój manifest MPEG-DASH
    const MPD_URL = "https://n-25-31.dcs.redcdn.pl/livedash/o2/wpp/live/11/live.livx?indexMode&dvr=7200000";

    // ClearKey para (keyId : key)
    const CLEARKEYS = {
      "20838b6bc2df0373e95a35538e666a2e": "6f10fbc7965f120a820e6d4dc9fcfa34"
    };

    async function initPlayer() {
      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      // Obsługa błędów
      player.addEventListener('error', e => console.error('Shaka error', e));

      try {
        await player.load(MPD_URL, null, {
          drm: {
            clearKeys: CLEARKEYS
          }
        });
        console.log('Stream załadowany!');
      } catch (err) {
        console.error('Błąd podczas ładowania', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
