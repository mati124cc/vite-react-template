<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eleven sports 1</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.4.2/shaka-player.ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mux.js@5.5.3/dist/mux.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.4.2/controls.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Styl ogólny dla strony */
        body {
            margin: 0;
            background: #121212;
            color: #eee;
            font-family: 'Roboto', sans-serif;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* STYLISTYKA GUI KANAŁÓW (MENU) */
        .gui-container {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gui-header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .gui-header h1 {
            font-weight: 300;
            color: #fff;
            margin: 0 0 20px 0;
            font-size: 2.5rem;
        }

        /* Wyszukiwarka */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 50px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .search-input:focus {
            background: #333;
            border-color: #ff3b3b;
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.3);
        }

        /* Grid (Siatka kafelków) */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .channel-card {
            background: linear-gradient(145deg, #1e1e1e, #252525);
            border-radius: 10px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ddd;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            background: #2d2d2d;
            border-color: #ff3b3b;
            color: #fff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .card-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
        }

        /* Responsywność */
        @media (max-width: 600px) {
            .gui-header h1 { font-size: 1.8rem; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .channel-card { min-height: 90px; }
        }

        /* --- STARY STYL PLAYERA (ZACHOWANY 1:1) --- */
        .youtube-theme { font-family: 'Roboto', sans-serif; }
        .youtube-theme .shaka-bottom-controls { width: 100%; padding: 0; padding-bottom: 0; z-index: 1; display: flex; flex-direction: column; }
        .youtube-theme .shaka-ad-controls { order: 1; }
        .youtube-theme .shaka-controls-button-panel { order: 2; height: 40px; padding: 0 10px; }
        .youtube-theme .shaka-range-container { margin: 4px 10px 4px 10px; top: 0; }
        .youtube-theme .shaka-small-play-button { order: -3; }
        .youtube-theme .shaka-mute-button { order: -2; }
        .youtube-theme .shaka-controls-button-panel > * { margin: 0; padding: 3px 8px; color: #EEE; height: 40px; }
        .youtube-theme .shaka-controls-button-panel > *:focus, .youtube-theme .shaka-controls-button-panel > *:hover { outline: none; color: #FFF; }
        .youtube-theme .shaka-controls-button-panel .shaka-volume-bar-container { position: relative; z-index: 10; left: -1px; order: -1; opacity: 0; width: 0px; transition: width 0.2s cubic-bezier(0.4, 0, 1, 1); height: 3px; padding: 0; }
        .youtube-theme .shaka-controls-button-panel .shaka-volume-bar-container:hover, .youtube-theme .shaka-controls-button-panel .shaka-volume-bar-container:focus { display: block; width: 50px; opacity: 1; padding: 0 6px; }
        .youtube-theme .shaka-mute-button:hover + div { opacity: 1; width: 50px; padding: 0 6px; }
        .youtube-theme .shaka-current-time { padding: 0 10px; font-size: 12px; }
        .youtube-theme .shaka-seek-bar-container { height: 3px; position: relative; top: -1px; border-radius: 0; margin-bottom: 0; }
        .youtube-theme .shaka-seek-bar-container .shaka-range-element { opacity: 0; }
        .youtube-theme .shaka-seek-bar-container:hover { height: 5px; top: 0; cursor: pointer; }
        .youtube-theme .shaka-seek-bar-container:hover .shaka-range-element { opacity: 1; cursor: pointer; }
        .youtube-theme .shaka-seek-bar-container input[type=range]::-webkit-slider-thumb { background: #FF0000; cursor: pointer; }
        .youtube-theme .shaka-seek-bar-container input[type=range]::-moz-range-thumb { background: #FF0000; cursor: pointer; }
        .youtube-theme .shaka-seek-bar-container input[type=range]::-ms-thumb { background: #FF0000; cursor: pointer; }
        .youtube-theme .shaka-video-container * { font-family: 'Roboto', sans-serif; }
        .youtube-theme .shaka-video-container .material-icons-round { font-family: 'Material Icons Sharp'; }
        .youtube-theme .shaka-overflow-menu, .youtube-theme .shaka-settings-menu { border-radius: 2px; background: rgba(28, 28, 28, 0.9); text-shadow: 0 0 2px rgb(0 0 0%); transition: opacity 0.1s cubic-bezier(0, 0, 0.2, 1); user-select: none; right: 10px; bottom: 50px; padding: 8px 0; min-width: 200px; }
        .youtube-theme .shaka-settings-menu { padding: 0 0 8px 0; }
        .youtube-theme .shaka-settings-menu button { font-size: 12px; }
        .youtube-theme .shaka-settings-menu button span { margin-left: 33px; font-size: 13px; }
        .youtube-theme .shaka-settings-menu button[aria-selected="true"] { display: flex; }
        .youtube-theme .shaka-settings-menu button[aria-selected="true"] span { order: 2; margin-left: 0; }
        .youtube-theme .shaka-settings-menu button[aria-selected="true"] i { order: 1; font-size: 18px; padding-left: 5px; }
        .youtube-theme .shaka-overflow-menu button { padding: 0; }
        .youtube-theme .shaka-overflow-menu button i { display: none; }
        .youtube-theme .shaka-overflow-menu button .shaka-overflow-button-label { display: flex; justify-content: space-between; flex-direction: row; align-items: center; cursor: default; outline: none; height: 40px; flex: 0 0 100%; }
        .youtube-theme .shaka-overflow-menu button .shaka-overflow-button-label span { flex-shrink: initial; padding-left: 15px; font-size: 13px; font-weight: 500; display: flex; align-items: center; }
        .youtube-theme .shaka-overflow-menu span + span { color: #FFF; font-weight: 400 !important; font-size: 12px !important; padding-right: 8px; padding-left: 0 !important; }
        .youtube-theme .shaka-overflow-menu .shaka-pip-button span + span { padding-right: 15px !important; }
        .youtube-theme .shaka-overflow-menu .shaka-pip-button span + span:after { content: ""; }
        .youtube-theme .shaka-back-to-overflow-button { padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.2); font-size: 12px; color: #eee; height: 40px; }
        .youtube-theme .shaka-back-to-overflow-button .material-icons-round { font-size: 15px; padding-right: 10px; }
        .youtube-theme .shaka-back-to-overflow-button span { margin-left: 3px !important; }
        .youtube-theme .shaka-overflow-menu button:hover, .youtube-theme .shaka-settings-menu button:hover { background-color: rgba(255, 255, 255, 0.1); cursor: pointer; }
        .youtube-theme .shaka-overflow-menu button:hover label, .youtube-theme .shaka-settings-menu button:hover label { cursor: pointer; }
        .youtube-theme .shaka-overflow-menu button:focus, .youtube-theme .shaka-settings-menu button:focus { background-color: rgba(255, 255, 255, 0.1); border: none; outline: none; }
        .youtube-theme .shaka-overflow-menu button, .youtube-theme .shaka-settings-menu button { color: #EEE; }
        .youtube-theme .shaka-captions-off { color: #BFBFBF; }
        .youtube-theme .shaka-overflow-menu-button { font-size: 18px; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="youtube-theme" data-shaka-player-container="" id="player" style="position:absolute;z-index: -1;top: 0;left: 0;width: 100%; height: 100%;object-fit: cover;">
        <video autoplay="" data-shaka-player="" poster="" id="video" style="width:100%;height:100%;"></video>
    </div>

    <script>
        // Dane z PHP
        const manifestUri = "https://n-25-31.dcs.redcdn.pl/livedash/o2/wpp/live/11/live.livx?indexMode&dvr=7200000";
        const hasDrm = true;
        const keyId = "20838b6bc2df0373e95a35538e666a2e";
        const keyHex = "6f10fbc7965f120a820e6d4dc9fcfa34";

        async function init() {
            // Inicjalizacja UI
            const video = document.getElementById('video');
            const ui = video['ui'];
            
            // Konfiguracja UI
            const config = {
                seekBarColors: {
                    base: '#4d4d4d',
                    played: '#ff0000',
                    buffered: '#8a8a8a',
                },
                volumeBarColors: {
                    base: 'rgb(77, 77, 77)',
                    level: 'rgb(255, 255, 255)',
                },
                customContextMenu: true,
                addBigPlayButton: false,
                contextMenuElements: ['statistics', 'loop'],
                overflowMenuButtons: ['captions', 'cast', 'quality', 'language', 'loop', 'playback_rate', 'airplay'],
                enableTooltips: true,
            };
            
            ui.configure(config);
            const controls = ui.getControls();
            const player = controls.getPlayer();

            // Ustawienia dla Debugowania
            window.player = player;
            window.ui = ui;

            // Obsługa błędów
            player.addEventListener('error', onPlayerErrorEvent);
            controls.addEventListener('error', onUIErrorEvent);

            // Konfiguracja DRM z PHP
            if (hasDrm) {
                player.configure({
                    drm: {
                        clearKeys: {
                            [keyId]: keyHex
                        }
                    }
                });
            }

            // Próba załadowania
            try {
                await player.load(manifestUri);
            } catch (error) {
                onPlayerError(error);
            }
        }

        function onPlayerErrorEvent(event) {
            onPlayerError(event.detail);
        }

        function onPlayerError(error) {
            console.error('Error code', error.code, 'object', error);
        }

        function onUIErrorEvent(event) {
            onPlayerError(event.detail);
        }

        function initFailed(errorEvent) {
            console.error('Unable to load the UI library!');
        }

        document.addEventListener('shaka-ui-loaded', init);
        document.addEventListener('shaka-ui-load-failed', initFailed);

        // Wyłączanie Picture-in-Picture (zgodnie z oryginałem)
        document.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.getElementById('video');
            if ('pictureInPictureEnabled' in document) {
                videoElement.disablePictureInPicture = true;
            }
        });
    </script>

</body>
</html>
